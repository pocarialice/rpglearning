# Cloudflare Worker（起こす係。構築手順書 3.14）のデプロイ。workers/wake を変えたら手動で動かす
# Environment dev の Secrets：CLOUDFLARE_API_TOKEN（Workers の編集と、ゾーンの Workers ルートの編集）・CLOUDFLARE_ACCOUNT_ID・SAKURACLOUD_ACCESS_TOKEN・SAKURACLOUD_ACCESS_TOKEN_SECRET
name: wake-worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wake-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: テスト（Worker）
        run: npx vitest run tests/unit/workers
      - name: デプロイ
        working-directory: workers/wake
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAKURACLOUD_ACCESS_TOKEN: ${{ secrets.SAKURACLOUD_ACCESS_TOKEN }}
          SAKURACLOUD_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURACLOUD_ACCESS_TOKEN_SECRET }}
        run: |
          npx --yes wrangler@4.40.0 deploy
          printf '%s' "$SAKURACLOUD_ACCESS_TOKEN" | npx --yes wrangler@4.40.0 secret put SAKURACLOUD_ACCESS_TOKEN
          printf '%s' "$SAKURACLOUD_ACCESS_TOKEN_SECRET" | npx --yes wrangler@4.40.0 secret put SAKURACLOUD_ACCESS_TOKEN_SECRET
          echo '### wake-worker をデプロイしました' >> "$GITHUB_STEP_SUMMARY"
