# dev サイトの前に置く Cloudflare Worker（構築手順書 3.14）。デプロイは GitHub Actions の wake-worker か、ここで npx wrangler@4 deploy
# 鍵（さくらのクラウドの APIキー）は wrangler secret put SAKURACLOUD_ACCESS_TOKEN / SAKURACLOUD_ACCESS_TOKEN_SECRET で入れる（ここには書かない）
name = "rpg-dev-wake"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
# 本体（テスターに公開する rpglearning.net）と、本体へ転送するだけの www・前の rpg-dev（Terraform の site_address・redirect_addresses と合わせる）
routes = [
  { pattern = "rpglearning.net/*", zone_name = "rpglearning.net" },
  { pattern = "www.rpglearning.net/*", zone_name = "rpglearning.net" },
  { pattern = "rpg-dev.rpglearning.net/*", zone_name = "rpglearning.net" }
]
[vars]
SAKURACLOUD_ZONE = "is1b"
SERVER_NAME = "rpg-dev-app"
CANONICAL_HOST = "rpglearning.net"
[observability]
enabled = true
