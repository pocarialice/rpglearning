<!DOCTYPE html>
<html lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<title>冒険者ギルド</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--parchment); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .seal { fill:var(--crimson); }
  .gold { fill:var(--gold); }
  .teal { fill:var(--teal); }
  .deep { fill:var(--ink); }
  .blk { rx:var(--radius-md); }
  .rule { stroke:var(--line-strong); stroke-width:1; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:64px; line-height:.95; font-weight:800; white-space:nowrap; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewbox="0 0 480 288" width="480" height="288">
<!--
  blocks      crimson 144x264 slab bled off the top (the guild's wax-seal colour, largest) · gold 128x160 (reward) · teal 128x48 (the partner) · ink 176x208 bled off the right, carrying a crimson seal disc (r = 40, a pill radius) · about 40% of 960x288
  arrangement a notice board: sheets pinned side by side, bottoms on one line space-8 above the edge, space-4 gutters
  pattern     hairline rules, from "紙の質感は線で出す" (texture comes from lines, not shadows): four line-strong rules at a space-8 pitch crossing the sheets like a ruled ledger
  scales      gutters space-4; rule pitch space-8; corners radius-md; seal radius-pill
-->
<rect class="seal blk" x="16" y="-8" width="144" height="264" rx="8"></rect>
<rect class="teal blk" x="176" y="32" width="128" height="48" rx="8"></rect>
<rect class="gold blk" x="176" y="96" width="128" height="160" rx="8"></rect>
<rect class="deep blk" x="320" y="48" width="176" height="208" rx="8"></rect>
<circle class="seal" cx="400" cy="152" r="40"></circle>
<line class="rule" x1="0" y1="128" x2="480" y2="128"></line>
<line class="rule" x1="0" y1="160" x2="480" y2="160"></line>
<line class="rule" x1="0" y1="192" x2="480" y2="192"></line>
<line class="rule" x1="0" y1="224" x2="480" y2="224"></line>
</svg>
</div>
<div class="words">
<h1 class="name">冒険者ギルド</h1>
<p class="tag">資格学習を、仲間と進める毎日の依頼に。</p>
</div>
</div>
</body>
</html>
